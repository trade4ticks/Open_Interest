questions:

  q1:
    question: CHAIN_INTRADAY_DIR is set in .env but the directory does not exist. What reads or writes it, and is that code path live?
    answer: code path intact but dormant; no scheduled reader or writer
    configured_path: /mnt/trading_volume_3/chain_intraday
    exists_on_disk: false
    volume_mounted: true
    volume_evidence: chain_live and chain_snapshots siblings present on the same volume
    writers:
      - script: fetch_chain_intraday.py
        via: lib/chain_intraday_store.py SessionWriter
        scheduled: false
      - script: diagnose_transform.py
        target: CHAIN_INTRADAY_DIR/_diag/
        scheduled: false
        incidental: true
    readers:
      - script: build_equity_surface.py
        condition: --source intraday
        default: false
        scheduled: false
      - script: verify_surface_fixes.py
        condition: --source intraday
        scheduled: false
      - script: lib/chain_live_store.py
        note: imports schema constants only, no I/O
      - script: test_equity_surface_parallel.py
        note: overrides env to a temp dir
    live_equivalent: CHAIN_LIVE_DIR, written by fetch_live_surface.py under run_live_pipeline.py cron
    uncertain: whether the directory previously held data that was deleted

  q2:
    question: What builds wf_bins and is_bins, and how is tt_bins meant to be built?
    premise_correction: cron does reach build_bin_tables.py, as a subprocess of run_pipeline.py and run_pipeline_early.py
    chain: crontab.txt -> run_pipeline*.py -> subprocess build_bin_tables.py
    wf_bins:
      built_by: build_bin_tables.py --tier {MORNING,EVENING}
      frequency: 3x per weekday (07:00, 09:35, 18:00)
      scheduled: true
    is_bins:
      built_by: build_bin_tables.py --tier {MORNING,EVENING}
      note: same flag as wf_bins, one flag writes both tables sequentially in main()
      frequency: 3x per weekday
      scheduled: true
    tt_thresholds:
      built_by: build_bin_tables.py --build-tt
      frequency: EVENING only
      scheduled: true
      status: legacy per build_bin_tables.py:571
    tt_bins:
      built_by: build_bin_tables.py --build-tt-bins
      scheduled: false
      caller: NONE
      detail: no cron entry, no script, no subprocess passes --build-tt-bins
      consumers: [dashboard (per build_bin_tables.py:571), build_trade_paths.py:473-497]
      impact: the table the dashboard reads is the one nothing refreshes
    date_discrepancy:
      status: RESOLVED_rev1
      source: docs/vps_state/bin_freshness.txt
      user_reported_last_write: 2026-08-14
      confirmed: true
      table_stats_last_stats_was: 2026-09-01 10:38:49
      table_stats_verdict: ANALYZE sweep, correctly rejected as evidence
      freshness:
        open_interest.tt_bins:        {earliest: 2018-12-31, latest: 2026-08-14, tickers: 121}
        open_interest.wf_bins:        {earliest: 2018-12-31, latest: 2026-09-14, tickers: 121}
        open_interest.is_bins:        {earliest: 2018-12-31, latest: 2026-09-14, tickers: 121}
        open_interest.daily_features: {earliest: 2018-12-31, latest: 2026-09-14, tickers: 121}
      gap_shape: dates_only
      gap_detail: identical 121-ticker coverage and identical 2018-12-31 start across all four; only the tail is missing
      downstream_impact: build_trade_paths.py joins current daily_features against tt_bins that stop one month short

  q3:
    question: Do the five empty research_* tables in open_interest get touched by this project?
    answer: no
    evidence: zero grep matches across the entire repo including sql/, migrations/, scalp/, and docs
    tables: [open_interest.research_runs, open_interest.research_results, open_interest.research_series, open_interest.research_charts, open_interest.research_followups]
    row_state: 0 live tuples, 0 inserts ever
    interpretation: never received a row, not emptied later
    spx_interpolated_counterparts:
      note: same five names plus research_knowledge, research_backtest_staging, research_backtest_uploads, research_pnl_uploads
      implication: open_interest has a partial copy of a fuller schema
    uncertain: which codebase created them
    uncertain_reason: dashboard is the obvious candidate but its source is not visible and vps_state/README.md is missing

  q4:
    question: Does any script in this project write /mnt/trading_volume_3 quote_ticks, ext_trades, or backup?
    answer: no
    evidence: repo-wide grep for quote_ticks, ext_trades, /mnt/, backup returns four hits, all in scalp/, all about equities_scalp
    project_writes_on_that_volume: [equities_scalp (scalp/), chain_live, chain_snapshots]
    ownership_inference: WITHDRAWN_rev1
    withdrawal_reason: >
      The first pass named Thetadata_Raw_SPX as likely owner of quote_ticks and
      ext_trades, reasoning from the truncated crontab.txt:1 fragment. The
      complete crontab confirms that project runs a 5-minute pipeline, but
      vps_state/README.md:24-26 says other projects' directories are out of
      scope and "Don't infer owners for them", and README:56-57 names these
      three directories specifically as "Out of scope; don't guess".
      Only the verified negative is asserted.
    unowned:
      - path: /mnt/trading_volume_3/backup
        written_by_this_project: false
        written_by_this_project_verified: true
        owner: not_determined_out_of_scope
      - path: /mnt/trading_volume_3/quote_ticks
        mtime: 2026-09-10 13:57
        written_by_this_project: false
        written_by_this_project_verified: true
        owner: not_determined_out_of_scope
        note: live, not archival - do not treat as reclaimable space
      - path: /mnt/trading_volume_3/ext_trades
        mtime: 2026-09-10 20:24
        written_by_this_project: false
        written_by_this_project_verified: true
        owner: not_determined_out_of_scope
        note: live, not archival
    spx_options_note:
      logical_store_halves: [/mnt/trading_volume_2/spx_options, /mnt/volume1/spx_options]
      third_location: /data/spx_options
      third_location_size: 395 MB
      third_location_referenced_in_project: false

