# ============================================================================
# SECTION 1b - SCRIPT INVENTORY: scalp/ and Cowork/
# ============================================================================

scalp_subsystem:
  scheduled: false
  scheduled_evidence: no crontab.txt entry names scalp, "-m scalp.", or any file under it
  invocation: python -m scalp.<module>
  isolation: deliberate
  isolation_evidence:
    - "scalp/__init__.py - self-contained by design, nothing imports from the project root"
    - "scalp/config.py - SELF-CONTAINED, deliberately does not import the project-root module"
    - "scalp/db.py - SELF-CONTAINED, does not import the project-root db.py"
    - "scalp/thetadata.py:2 - SELF-CONTAINED BY DESIGN, DO NOT REFACTOR INTO A SHARED MODULE"
  duplication_verdict: intentional, not drift
  storage_contract: "scalp/store.py:4 - Parquet is the record. Postgres holds derived metrics only, no tick data"
  database: equities_scalp

scripts_1b:

  - path: scalp/update_universe.py
    group: scalp_pipeline
    purpose: "Nightly candidate list. One API call."
    kind: entry
    invocation: python -m scalp.update_universe
    flags: ["--date", "--from-eod", "--candidates", "--eod-workers", "--dry-run", "--verbose"]
    invoked_by: manual
    invoked_note: docstring says nightly but no cron entry exists
    git: 2026-09-06
    reads: {apis: [thetadata stock EOD]}
    writes: {tables: [equities_scalp.universe], helper: "scalp/db.py:763 write_universe"}

  - path: scalp/fetch.py
    group: scalp_pipeline
    purpose: "Fetch trade_quote to parquet. Resumable, incremental, space-aware."
    kind: entry
    flags: ["--start", "--end", "--symbols", "--workers", "--plan", "--yes", "--confirm-threshold", "--allow-today", "--min-exchange-codes", "--verbose"]
    invoked_by: manual
    git: 2026-09-01
    reads: {apis: ["thetadata /v3/stock/history/trade_quote"], tables: [equities_scalp.universe]}
    writes:
      parquet: ["SCALP_DATA_DIR/raw/{SYMBOL}/{YYYY-MM-DD}.parquet"]
      tables: [equities_scalp.fetch_runs]

  - path: scalp/compute.py
    group: scalp_pipeline
    purpose: "Read parquet, compute metrics, write Postgres."
    kind: entry
    flags: ["--start", "--end", "--symbols", "--no-intraday", "--no-quiet", "--replace", "--workers", "--print", "--verbose"]
    invoked_by: manual
    git: 2026-09-07
    reads: {parquet: [SCALP_DATA_DIR]}
    writes:
      tables: [equities_scalp.daily_metrics, equities_scalp.provenance, equities_scalp.intraday_metrics, equities_scalp.intraday_monthly]

  - path: scalp/prune.py
    group: scalp_pipeline
