ID: open_interest-inventory
generated: 2026-09-14
pass: read-only
scope:
  included: [root, lib/, analysis/, migrations/, scalp/, Cowork/]
  excluded: [.venv/, __pycache__/]
  note: "Sections 1a, 1b and 2 complete. Section 3 not yet written."

precedence:
  rule_set_in: rev2
  order:
    - rank: 1
      source: machine-verified vps_state captures
      files: [crontab.txt, oi_schema_trimmed.sql, table_stats.txt, env_paths.txt, storage_layout.txt, bin_freshness.txt]
      status: truth
    - rank: 2
      source: source code in this repo
      status: beats all prose including vps_state/README.md
    - rank: 3
      source: vps_state/README.md prose
      status: orientation notes; authoritative on out-of-scope boundaries, not on what writes what
    - rank: 4
      source: project-root docs (README.md, CLAUDE.md, PIPELINE_BRIEF.md)
      status: lowest
  consequence: where rank 2 beats rank 3, the README is listed as needing correction, not as a finding

verification:
  scripts: read from working-tree source
  database: "docs/vps_state/ machine-generated captures"
  unverifiable: "marked with an uncertain flag and a reason"
  table_naming: always database.table

revisions:
  - id: rev1
    date: 2026-09-14
    inputs_changed:
      - docs/vps_state/README.md supplied
      - docs/vps_state/crontab.txt re-supplied complete (8 jobs, was 6 - first two were truncated)
      - docs/vps_state/bin_freshness.txt added
      - batabases.txt renamed databases.txt
    sections_revised: [vps_state_gaps, cron, doc_conflicts.3, questions.q2, questions.q4]
    section_1a_script_rows_changed: none
    reason: the two recovered cron jobs belong to other projects and invoke nothing in this repo

vps_state_gaps:
  - file: docs/vps_state/README.md
    status: resolved_rev1
    was: absent
  - file: docs/vps_state/databases.txt
    status: resolved_rev1
    was: present_as_batabases.txt
  - file: docs/vps_state/crontab.txt
    status: resolved_rev1
    was: truncated_first_two_jobs_missing
    effect_before: total job count understated as 6; Q4 ownership inferred from a partial line
  - file: docs/vps_state/table_stats.txt
    issue: last_stats is an ANALYZE timestamp, not a last-write time
    effect: cannot be used to date last writes
    superseded_for_bins_by: docs/vps_state/bin_freshness.txt
  - file: docs/vps_state/table_stats.txt
    issue: database not named in header
    assumption: open_interest (all relnames match that DB, none match others)
  - file: equities_scalp schema
    status: not_supplied
    effect: PKs for equities_scalp tables are read from scalp/db.py CREATE TABLE statements, i.e. what the code creates, not what is deployed

cron:
  source: docs/vps_state/crontab.txt
  revision: rev1_complete_8_jobs
  total_jobs: 8
  project_jobs: 5
  timezone: America/New_York
  timezone_note: >
    TZ=America/New_York is set at crontab.txt:22, after the first two jobs.
    Cron environment assignments apply only to entries that follow them, so the
    Portfolio_Dashboard and Thetadata_Raw_SPX jobs run in the system timezone,
    not ET. Observation only - both are other projects' jobs and out of scope.
  entries:
    - schedule: "*/5 * * * 1-5"
      command: /root/Portfolio_Dashboard/scripts/fetch_trades.py
      lock: /tmp/fetch_trades.lock
      project: Portfolio_Dashboard
      in_project: false
      recovered_in: rev1
    - schedule: "1-59/5 * * * 1-5"
      command: /Thetadata_Raw_SPX/run_pipeline.py
      lock: /tmp/spx_pipeline.lock
      project: Thetadata_Raw_SPX
      in_project: false
      recovered_in: rev1
      note: offset one minute from the dashboard job
    - schedule: "00 18 * * 1-5"
      command: run_pipeline.py --tier EVENING
      lock: /tmp/oi_research.lock
      tier: EVENING
    - schedule: "00 7 * * 1-5"
      command: run_pipeline_early.py
      lock: /tmp/oi_research.lock
      tier: PREMARKET
    - schedule: "35 9 * * 1-5"
      command: run_pipeline.py --tier MORNING
      lock: /tmp/oi_research.lock
      tier: MORNING
    - schedule: "*/5 9-16 * * 1-5"
      command: run_live_pipeline.py
      lock: /tmp/live_surface.lock
      tier: LIVE
    - schedule: "30 20 * * 1-5"
      command: fetch_earnings_calendar.py
      lock: /tmp/earnings.lock
      tier: EARNINGS
    - schedule: "0 2 * * *"
      command: /usr/local/bin/pg_backup.sh
      tier: BACKUP
      in_project: false
  systemd_timers:
    relevant_to_project: false
    note: all 18 timers in timers.txt are OS-level (apt, logrotate, sysstat, fwupd)

parquet_roots:
  source: docs/vps_state/env_paths.txt
  OI_RAW_DIR: /data/oi_raw
  CHAIN_EOD_DIR: /data/chain_eod
  EQUITY_1MIN_DIR: /data/equity_1min
  CHAIN_INTRADAY_DIR: /mnt/trading_volume_3/chain_intraday
  CHAIN_SNAPSHOTS_DIR: /mnt/trading_volume_3/chain_snapshots
  CHAIN_LIVE_DIR: /mnt/trading_volume_3/chain_live

critical_findings:
  - id: build_features_destroyed
    severity: high
    file: build_features.py
    detail: >
      Working tree is 2 bytes (newline + "q"). git diff reports 1755 deletions,
      1 insertion, uncommitted. HEAD version is 89858 bytes.
      run_pipeline.py:57 and run_pipeline_early.py:49 import build_for_ticker at
      module scope, so both fail at import locally. VPS runs its own checkout.
    recovery: git checkout -- build_features.py
    acted_on: false
  - id: tt_bins_no_caller
    severity: high
    table: open_interest.tt_bins
    detail: >
      Built only by build_bin_tables.py --build-tt-bins (:377). No cron entry,
      no script, no subprocess passes that flag. run_pipeline.py:237 passes
      --build-tt, which writes open_interest.tt_thresholds instead.
      Dashboard reads tt_bins per build_bin_tables.py:571; build_trade_paths.py
      reads it at :473-497.
    acted_on: false

doc_conflicts:
  - n: 1
    doc: README.md:119-122
    claim: single cron entry "0 7 * * 1-5 run_pipeline.py" with no tier flag
    truth: five Open_Interest cron entries; run_pipeline.py requires --tier
    severity: high
  - n: 2
    doc: README.md:106
    claim: one daily run of four steps
    truth: three daily tiers plus a 5-minute intraday loop plus a 20:30 earnings job
    severity: high
  - n: 3
    doc: PIPELINE_BRIEF.md:244
    claim: "Nothing runs on a schedule unless I add it to cron myself."
    truth: six active cron entries, five of them this project's
    severity: high
  - n: 4
    doc: CLAUDE.md:19-24
    claim: two tiers, EVENING always before MORNING
    truth: >
      correct as far as it goes, but omits the 07:00 PREMARKET cron, which also
      calls build_features with tier="MORNING" (run_pipeline_early.py:188).
      Two crons write MORNING columns for the same trade_date.
    severity: medium
  - n: 5
    doc: build_bin_tables.py:2
    claim: "Build / refresh wf_bins and tt_thresholds"
    truth: also builds open_interest.is_bins (:266) and open_interest.tt_bins (:377)
    severity: medium
  - n: 6
    doc: build_bin_tables.py:5-6
    claim: usage block lists --tier and --build-tt
    truth: omits --build-tt-bins, the only writer of open_interest.tt_bins
    severity: high
  - n: 7
    doc: README.md:32
    claim: config.py is "Postgres + ThetaData + OI_RAW_DIR"
    truth: six parquet roots plus Polygon credentials
    severity: low
  - n: 8
    doc: sql/01_schema.sql:10
    claim: build_features.py reads OI_RAW_DIR parquet directly
    truth: true at HEAD; false in the working tree (see build_features_destroyed)
    severity: low
  - n: 9
    doc: run_live_pipeline.py:45-49
    claim: cron line for the live loop
    truth: matches crontab.txt:16 exactly
    severity: none
    note: no conflict, recorded as the one doc that is correct
  - n: 10
    doc: migrations/README.md:13
    claim: option_oi_raw dropped 2026-09-01
    truth: confirmed absent from open_interest
    severity: none
    note: no conflict, confirms the doc

scripts:

  - path: run_pipeline.py
    group: orchestrator
    purpose: "Daily two-tier pipeline."
    kind: entry
    flags: ["--tier {MORNING,EVENING} (required)"]
    invoked_by: cron
    invoked_detail: crontab.txt:7 (18:00 EVENING), crontab.txt:13 (09:35 MORNING)
    git: 2026-06-10
    reads:
      tables: [open_interest.underlying_ohlc]
      parquet: [OI_RAW_DIR]
      apis: [thetadata]
    writes:
      tables: []
      parquet: []
    calls: [fetch_ohlc.py, fetch_chain_eod.py, fetch_oi.py, fetch_oi_snapshot.py, build_features.py, build_bin_tables.py]

  - path: run_pipeline_early.py
    group: orchestrator
    purpose: "7 am pre-open pipeline."
    kind: entry
    flags: []
    invoked_by: cron
    invoked_detail: crontab.txt:10 (07:00)
    git: 2026-06-07
    reads:
      tables: [open_interest.underlying_ohlc]
      parquet: [OI_RAW_DIR]
    writes:
      tables: []
      parquet: []
    calls: [fetch_ohlc_premarket.py, fetch_oi_snapshot.py, build_features.py, build_bin_tables.py]

  - path: run_live_pipeline.py
    group: orchestrator
    purpose: "live capture, then metrics for what it just captured."
    kind: entry
    flags: ["--skip-metrics", "--no-z", "--tickers", "--connections", "--workers", "--max-inflight", "--no-persist", "--force", "--lock", "--no-lock"]
    invoked_by: cron
    invoked_detail: crontab.txt:16 (*/5 9-16 weekdays)
    git: 2026-08-25
    reads: {tables: [], parquet: []}
    writes: {tables: [], parquet: []}
    calls: [fetch_live_surface.py, build_equity_metrics.py]

  - path: fetch_ohlc.py
    group: fetcher
    purpose: "Pull daily OHLC for one or more tickers from yfinance and upsert into underlying_ohlc."
    kind: entry
    flags: []
    flags_note: interactive prompt, no argparse
    invoked_by: [run_pipeline.py, cron]
    git: 2026-06-07
    reads: {tables: [open_interest.underlying_ohlc], apis: [yfinance]}
    writes: {tables: [open_interest.underlying_ohlc]}

  - path: fetch_ohlc_premarket.py
    group: fetcher
    purpose: "Fetch a premarket open-price proxy from ThetaData's IV snapshot endpoint and write it to underlying_ohlc.open with provenance."
    kind: entry
    flags: []
    invoked_by: [run_pipeline_early.py, cron]
    git: 2026-06-09
    reads: {apis: [thetadata]}
    writes: {tables: [open_interest.underlying_ohlc], columns: [open]}

  - path: fetch_oi.py
    group: fetcher
    purpose: "Pull daily Open Interest from ThetaData and write to parquet at {OI_RAW_DIR}/{ticker}/{year}.parquet."
    kind: entry
    flags: []
    flags_note: interactive prompt
    invoked_by: [run_pipeline.py, cron]
    git: 2026-09-01
    reads: {apis: [thetadata], parquet: [OI_RAW_DIR]}
    writes: {parquet: ["OI_RAW_DIR/{TICKER}/{year}.parquet"]}

  - path: fetch_oi_snapshot.py
    group: fetcher
    purpose: "Pull TODAY's OI snapshot and write to parquet at {OI_RAW_DIR}/{ticker}/{year}.parquet."
    kind: entry
    flags: []
    flags_note: interactive prompt
    invoked_by: [run_pipeline.py, run_pipeline_early.py, cron]
    git: 2026-05-19
    reads: {apis: [thetadata]}
    writes: {parquet: ["OI_RAW_DIR/{TICKER}/{year}.parquet"]}

  - path: fetch_chain_eod.py
    group: fetcher
    purpose: "Pure I/O fetcher for ThetaData's EOD greeks chain. Replaces both fetch_volume_eod.py and fetch_iv_chain.py."
    kind: entry
    flags: []
    invoked_by: [run_pipeline.py, cron]
    git: 2026-06-08
    reads: {apis: [thetadata], parquet: [OI_RAW_DIR]}
    writes: {parquet: ["CHAIN_EOD_DIR/{TICKER}/{year}.parquet"]}

  - path: fetch_live_surface.py
    group: fetcher
    purpose: "live intraday surface, every 5 minutes."
    kind: entry
    flags: ["--tickers", "--connections", "--workers", "--max-inflight", "--no-persist", "--force", "--lock", "--no-lock"]
    invoked_by: [run_live_pipeline.py, cron]
    git: 2026-08-25
    reads: {apis: [thetadata], tables: [open_interest.equity_surface_diagnostics]}
    writes:
      parquet: ["CHAIN_LIVE_DIR/{TICKER}/{YYYYMMDD}/{HHMM}.parquet"]
      tables: [open_interest.equity_surface, open_interest.equity_atm, open_interest.equity_surface_diagnostics]

  - path: fetch_earnings_calendar.py
    group: fetcher
    purpose: "nightly earnings calendar refresh from yfinance."
    kind: entry
    flags: ["--tickers", "--delay", "--limit", "--init-db"]
    invoked_by: cron
    invoked_detail: crontab.txt:23 (20:30 weekdays)
    git: 2026-08-25
    reads: {apis: [yfinance], parquet: [CHAIN_SNAPSHOTS_DIR, OI_RAW_DIR]}
    writes: {tables: [open_interest.earnings_calendar, open_interest.earnings_coverage]}

  - path: fetch_chain_snapshots.py
    group: fetcher
    purpose: "Pure I/O fetcher for twice-daily intraday option chain snapshots (09:45:00 and 15:45:00 ET)."
    kind: entry
    flags: ["--force", "--repair", "--batch-days", "--connections", "--write-queue", "--debug-response", "--resume", "--progress-file", "--tickers", "--start", "--end"]
    invoked_by: manual
    git: 2026-08-26
    reads: {apis: [thetadata], parquet: [OI_RAW_DIR]}
    writes: {parquet: ["CHAIN_SNAPSHOTS_DIR/{TICKER}/{YYYYMM}.parquet"]}

  - path: fetch_chain_intraday.py
    group: fetcher
    purpose: "full-day 5-minute intraday option chain bars. Sister script to fetch_chain_snapshots.py."
