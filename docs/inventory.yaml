    invoked_detail: run_live_pipeline.py:75 imports run_for_snapshot
    git: 2026-08-25
    reads: {tables: [open_interest.equity_surface_diagnostics, open_interest.equity_surface, open_interest.equity_atm, open_interest.underlying_ohlc, open_interest.earnings_calendar]}
    writes: {tables: [open_interest.equity_metrics, open_interest.equity_metrics_z, open_interest.equity_metrics_catalog]}

