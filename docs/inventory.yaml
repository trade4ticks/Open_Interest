    writes: {parquet: ["CHAIN_INTRADAY_DIR/{TICKER}/{YYYYMMDD}.parquet", "CHAIN_INTRADAY_DIR/{TICKER}/{YYYYMMDD}.manifest.json"]}
    note: target directory does not exist on disk; see question q1

  - path: fetch_equity_1min.py
    group: fetcher
    purpose: "1-minute equity bars from Polygon.io / Massive."
    kind: entry
    flags: ["--dry-run", "--probe", "--force", "--repair", "--batch-chunks", "--connections", "--splice-renames", "--symbol-history-out", "--no-symbol-history", "--debug-response", "--tickers", "--start", "--end"]
    invoked_by: manual
    git: 2026-08-15
    reads: {apis: [polygon], parquet: [OI_RAW_DIR]}
    writes: {parquet: ["EQUITY_1MIN_DIR/{TICKER}/{year}.parquet", "EQUITY_1MIN_DIR/_manifest/{TICKER}.parquet"]}

  - path: fetch_iv_chain.py
    group: fetcher
    purpose: "Pull EOD greeks and upsert ATM IV metrics to option_iv_daily."
    kind: entry
    flags: []
    invoked_by: nothing_found
    superseded_by: fetch_chain_eod.py
    git: 2026-05-27
    reads: {apis: [thetadata], tables: [open_interest.underlying_ohlc], parquet: [OI_RAW_DIR]}
    writes: {tables: [open_interest.option_iv_daily]}

  - path: fetch_volume_eod.py
    group: fetcher
    purpose: "Pull EOD option volume and upsert aggregated metrics to option_volume_daily."
    kind: entry
    flags: []
    invoked_by: nothing_found
    superseded_by: fetch_chain_eod.py
    git: 2026-05-27
    reads: {apis: [thetadata], tables: [open_interest.underlying_ohlc]}
    writes: {tables: [open_interest.option_volume_daily]}

  - path: build_features.py
    group: builder
    purpose: "Builds the daily_features row per (ticker, trade_date) across MORNING/EVENING column sets."
    purpose_source: git show HEAD (working tree is destroyed)
    kind: entry
    flags: ["--tier"]
    flags_note: run_pipeline* call build_for_ticker() directly, not the CLI
    invoked_by: [run_pipeline.py, run_pipeline_early.py, cron]
    git: 2026-06-09
    working_tree_state: DESTROYED_2_BYTES
    reads:
      tables: [open_interest.underlying_ohlc]
      parquet: [OI_RAW_DIR, CHAIN_EOD_DIR]
      via: duckdb read_parquet
    writes:
      tables: [open_interest.daily_features]
      mechanism: MORNING_UPSERT_SQL / EVENING_UPSERT_SQL, disjoint column sets

  - path: build_bin_tables.py
    group: builder
    purpose: "Build / refresh wf_bins and tt_thresholds."
    purpose_note: docstring stale; also builds is_bins and tt_bins
    kind: entry
    flags: ["--tier {MORNING,EVENING}", "--build-tt-bins", "--build-tt"]
    invoked_by: [run_pipeline.py, run_pipeline_early.py, cron]
    invoked_detail: subprocess at run_pipeline.py:235 and run_pipeline_early.py:112
    git: 2026-08-16
    reads: {tables: [open_interest.daily_features, open_interest.metric_classification]}
    writes_by_flag:
      "--tier": [open_interest.wf_bins, open_interest.is_bins]
      "--build-tt-bins": [open_interest.tt_bins]
      "--build-tt": [open_interest.tt_thresholds]
    flag_name_mismatch: true
    flag_name_mismatch_detail: "--build-tt writes tt_thresholds, not tt_bins; --build-tt-bins writes tt_bins and is never passed"

  - path: build_equity_surface.py
    group: builder
    purpose: "stage 3 of the chain pipeline. fetch -> clean -> INTERPOLATE -> metrics"
    kind: entry
    flags: ["--start", "--end", "--tickers", "--source", "--workers"]
    invoked_by: manual
    git: 2026-08-26
    reads:
      parquet: [CHAIN_SNAPSHOTS_DIR, CHAIN_INTRADAY_DIR]
      parquet_note: CHAIN_SNAPSHOTS_DIR is the default; CHAIN_INTRADAY_DIR only with --source intraday
      tables: [open_interest.equity_surface_diagnostics]
    writes: {tables: [open_interest.equity_surface, open_interest.equity_atm, open_interest.equity_surface_diagnostics]}

  - path: build_equity_metrics.py
    group: builder
    purpose: "derived vol metrics off the interpolated surface. Stage 4."
    kind: entry
    flags: ["--start", "--end", "--tickers", "--snapshots", "--rebuild", "--no-z"]
